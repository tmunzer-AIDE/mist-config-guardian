<div class="brand">
  <span class="brand-mark" aria-hidden="true">
    <i class="bar bar--dim"></i>
    <i class="bar bar--lit"></i>
    <i class="bar bar--dim"></i>
  </span>
  <span class="brand-text">
    <span class="brand-name">Config Guardian</span>
    <span class="brand-sub">MIST CONFIGURATION</span>
  </span>
</div>

<nav aria-label="Primary">
  @for (item of items; track item.path) {
    <a
      class="nav-item"
      [attr.title]="item.label"
      [routerLink]="item.path"
      routerLinkActive="nav-item--on"
      [routerLinkActiveOptions]="{ exact: item.exact }"
      #link="routerLinkActive"
      [attr.aria-current]="link.isActive ? 'page' : null"
    >
      <svg
        class="nav-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        @switch (item.icon) {
          @case ('overview') {
            <path d="M3 12h3.6l2.3-6.6 4 13.2 2.3-6.6H21" />
          }
          @case ('changes') {
            <circle cx="12" cy="12" r="3.3" />
            <path d="M3 12h5.7" />
            <path d="M15.3 12H21" />
          }
          @case ('history') {
            <path d="M3.4 12a8.6 8.6 0 1 0 2.5-6.1" />
            <path d="M3 4.2v4.2h4.2" />
            <path d="M12 8.2V12l2.9 1.7" />
          }
          @case ('restore') {
            <rect x="3" y="3.6" width="18" height="5.4" rx="1.4" />
            <path d="M5.4 9v9a2 2 0 0 0 2 2h9.2a2 2 0 0 0 2-2V9" />
            <path d="M12 12.4v4.4" />
            <path d="M9.7 14.6 12 12.3l2.3 2.3" />
          }
          @case ('impact') {
            <path d="M3.4 4v15.6H21" />
            <path d="M7 15.2l3.6-4.4 3.1 2.5L20 7.4" />
          }
          @case ('settings') {
            <circle cx="12" cy="12" r="2.9" />
            <path
              d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"
            />
          }
        }
      </svg>
      <span class="nav-label">{{ item.label }}</span>
      @if (item.icon === 'changes' && changeBadge() > 0) {
        <span class="nav-badge">{{ changeBadge() }}</span>
      }
    </a>
  }
</nav>

<div class="build">
  <div class="build-label">{{ buildLabel() }}</div>
</div>
