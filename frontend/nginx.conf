server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This server is the edge of the Compose stack, so the address it saw is
        # the client. Replacing the header rather than appending to it drops
        # whatever the client claimed, and the API, which trusts this hop,
        # throttles each client on its own address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
