categories:
  - Monitoring
  - Security

questions:
  - variable: replicaCount
    default: 1
    type: int
    min: 1
    label: API and frontend replicas
    group: Workloads
  - variable: workerReplicaCount
    default: 1
    type: int
    min: 1
    label: Celery worker replicas
    group: Workloads

  - variable: service.type
    default: ClusterIP
    type: enum
    options:
      - ClusterIP
      - NodePort
      - LoadBalancer
    label: Frontend service type
    group: Networking
  - variable: service.port
    default: 80
    type: int
    min: 1
    max: 65535
    label: Frontend service port
    group: Networking
  - variable: ingress.enabled
    default: false
    type: boolean
    label: Enable ingress
    group: Networking
    show_subquestion_if: true
    subquestions:
      - variable: ingress.className
        default: ""
        type: string
        label: Ingress class name
      - variable: ingress.host
        default: guardian.example.com
        type: hostname
        required: true
        label: Application hostname
      - variable: ingress.tlsSecretName
        default: ""
        type: string
        label: TLS Secret name
        description: Leave empty to expose the ingress without TLS.
  - variable: config.corsOrigins
    default: https://guardian.example.com
    type: string
    required: true
    label: Allowed CORS origins
    description: Comma-separated application origins, including scheme.
    group: Networking

  - variable: secrets.create
    default: false
    type: boolean
    label: Create the application Secret
    description: Prefer an externally managed Secret in production. Managed values are also stored in Helm release data.
    group: Secrets
    show_subquestion_if: true
    subquestions:
      - variable: secrets.secretKey
        default: ""
        type: password
        required: true
        label: JWT signing secret
        description: "Generate with: openssl rand -hex 32"
      - variable: secrets.bootstrapAdminToken
        default: ""
        type: password
        required: true
        label: Administrator bootstrap token
        description: "Used once to create the first administrator. Generate with: openssl rand -hex 32"
      - variable: secrets.credentialEncryptionKey
        default: ""
        type: password
        required: true
        label: Credential encryption key
        description: "Back up this value; losing it makes encrypted credentials unrecoverable. Generate with: openssl rand -hex 32"
      - variable: secrets.influxdbToken
        default: ""
        type: password
        required: true
        label: InfluxDB API token
        description: "Must match the configured InfluxDB token. Generate with: openssl rand -hex 32"
  - variable: existingSecret
    default: mist-config-guardian-secrets
    type: string
    required: true
    label: Existing Secret name
    description: >-
      Must contain SECRET_KEY, BOOTSTRAP_ADMIN_TOKEN,
      CREDENTIAL_ENCRYPTION_KEY, and INFLUXDB_TOKEN. Generate each value with
      `openssl rand -hex 32`, then create the Secret with
      `kubectl create secret generic mist-config-guardian-secrets
      --from-literal=SECRET_KEY=<value>
      --from-literal=BOOTSTRAP_ADMIN_TOKEN=<value>
      --from-literal=CREDENTIAL_ENCRYPTION_KEY=<value>
      --from-literal=INFLUXDB_TOKEN=<value>`.
    group: Secrets
    show_if: "secrets.create=false"

  - variable: config.impactAiEnabled
    default: false
    type: boolean
    label: Enable AI-assisted impact analysis
    group: AI Impact Analysis
    show_subquestion_if: true
    subquestions:
      - variable: config.impactAiBaseUrl
        default: ""
        type: string
        required: true
        label: OpenAI-compatible API base URL
      - variable: config.impactAiModel
        default: ""
        type: string
        required: true
        label: Model name
      - variable: secrets.impactAiApiKey
        default: ""
        type: password
        label: AI API key
        description: Required here only when the chart creates the Secret; otherwise add IMPACT_AI_API_KEY to the existing Secret.
