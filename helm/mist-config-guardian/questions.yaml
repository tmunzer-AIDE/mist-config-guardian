categories:
  - Monitoring
  - Security

questions:
  - variable: replicaCount
    default: 1
    type: int
    min: 1
    label: API and frontend replicas
    group: Workloads
  - variable: workerReplicaCount
    default: 1
    type: int
    min: 1
    label: Celery worker replicas
    group: Workloads

  - variable: service.type
    default: ClusterIP
    type: enum
    options:
      - ClusterIP
      - NodePort
      - LoadBalancer
    label: Frontend service type
    group: Networking
  - variable: service.port
    default: 80
    type: int
    min: 1
    max: 65535
    label: Frontend service port
    group: Networking
  - variable: ingress.enabled
    default: false
    type: boolean
    label: Enable ingress
    group: Networking
    show_subquestion_if: true
    subquestions:
      - variable: ingress.className
        default: ""
        type: string
        label: Ingress class name
      - variable: ingress.host
        default: guardian.example.com
        type: hostname
        required: true
        label: Application hostname
      - variable: ingress.tlsSecretName
        default: ""
        type: string
        label: TLS Secret name
        description: Leave empty to expose the ingress without TLS.
  - variable: config.corsOrigins
    default: https://guardian.example.com
    type: string
    required: true
    label: Allowed CORS origins
    description: Comma-separated application origins, including scheme.
    group: Networking
  - variable: config.webauthnOrigin
    default: ""
    type: string
    label: Passkey origin
    description: >-
      The browser address of the application, with scheme, that passkeys are
      verified against. Leave empty to use the ingress hostname over HTTPS, or
      the first CORS origin when no ingress is enabled.
    group: Networking
  - variable: config.webauthnRpId
    default: ""
    type: string
    label: Passkey domain
    description: >-
      The domain passkeys are bound to. Leave empty to use the host of the
      passkey origin. Set a registrable parent domain to make one passkey work
      across sibling hostnames.
    group: Networking

  - variable: secrets.create
    default: false
    type: boolean
    label: Create the application Secret
    description: Prefer an externally managed Secret in production. Managed values are also stored in Helm release data.
    group: Secrets
    show_subquestion_if: true
    subquestions:
      - variable: secrets.secretKey
        default: ""
        type: password
        required: true
        label: JWT signing secret
        description: "Generate with: openssl rand -hex 32"
      - variable: secrets.bootstrapAdminToken
        default: ""
        type: password
        required: true
        label: Administrator bootstrap token
        description: "Used once to create the first administrator. Generate with: openssl rand -hex 32"
      - variable: secrets.credentialEncryptionKey
        default: ""
        type: password
        required: true
        label: Credential encryption key
        description: "Back up this value; losing it makes encrypted credentials unrecoverable. Generate with: openssl rand -hex 32"
      - variable: secrets.influxdbToken
        default: ""
        type: password
        required: true
        label: InfluxDB API token
        description: "Must match the configured InfluxDB token. Generate with: openssl rand -hex 32"
      - variable: secrets.mongodbRootUsername
        default: guardian
        type: string
        required: true
        label: MongoDB username
        description: >-
          The account the bundled MongoDB creates and then requires. Set at
          first install only: changing it later does not rename the account
          MongoDB already has.
      - variable: secrets.mongodbRootPassword
        default: ""
        type: password
        required: true
        label: MongoDB password
        description: >-
          Goes into a connection URI, so use only letters, digits and -._~ .
          Generate with `openssl rand -hex 32`. Set at first install only:
          MongoDB keeps this in its data directory, so changing it here on an
          existing volume makes the database unreachable. See the README to
          rotate it.
      - variable: secrets.redisPassword
        default: ""
        type: password
        required: true
        label: Redis password
        description: "Goes into a connection URI, so use only letters, digits and -._~ . Generate with: openssl rand -hex 32"
  - variable: networkPolicy.enabled
    default: true
    type: boolean
    label: Restrict pod-to-pod traffic
    description: >-
      Refuses every connection a pod in this release was not meant to receive,
      then allows the ones it was. Requires a CNI that enforces NetworkPolicy;
      on a cluster without one these objects have no effect.
    group: Networking

  - variable: existingSecret
    default: mist-config-guardian-secrets
    type: string
    required: true
    label: Existing Secret name
    description: >-
      Must contain SECRET_KEY, BOOTSTRAP_ADMIN_TOKEN,
      CREDENTIAL_ENCRYPTION_KEY, and INFLUXDB_TOKEN, plus
      MONGODB_ROOT_USERNAME and MONGODB_ROOT_PASSWORD when MongoDB is bundled
      and REDIS_PASSWORD when Redis is bundled. Generate each value with
      `openssl rand -hex 32`, then create the Secret with
      `kubectl create secret generic mist-config-guardian-secrets
      --from-literal=SECRET_KEY=<value>
      --from-literal=BOOTSTRAP_ADMIN_TOKEN=<value>
      --from-literal=CREDENTIAL_ENCRYPTION_KEY=<value>
      --from-literal=INFLUXDB_TOKEN=<value>
      --from-literal=MONGODB_ROOT_USERNAME=guardian
      --from-literal=MONGODB_ROOT_PASSWORD=<value>
      --from-literal=REDIS_PASSWORD=<value>`.
    group: Secrets
    show_if: "secrets.create=false"
