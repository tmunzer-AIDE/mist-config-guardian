{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mist-config-guardian.secretName" . }}
  labels:
    {{- include "mist-config-guardian.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.secretKey is required when secrets.create is true" .Values.secrets.secretKey | quote }}
  BOOTSTRAP_ADMIN_TOKEN: {{ required "secrets.bootstrapAdminToken is required when secrets.create is true" .Values.secrets.bootstrapAdminToken | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ required "secrets.credentialEncryptionKey is required when secrets.create is true" .Values.secrets.credentialEncryptionKey | quote }}
  INFLUXDB_TOKEN: {{ required "secrets.influxdbToken is required when secrets.create is true" .Values.secrets.influxdbToken | quote }}
{{- end }}
