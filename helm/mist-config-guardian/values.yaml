image:
  repository: docker.io/tmunzer/mist-config-guardian
  tag: "0.2.2"
  pullPolicy: IfNotPresent

frontendImage:
  repository: docker.io/tmunzer/mist-config-guardian-frontend
  tag: "0.2.2"
  pullPolicy: IfNotPresent

replicaCount: 1
workerReplicaCount: 1

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "8"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources: {}

influxdb:
  enabled: true
  image:
    repository: influxdb
    tag: "2.7-alpine"
    pullPolicy: IfNotPresent
  adminUsername: admin
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources: {}

service:
  type: ClusterIP
  port: 80

existingSecret: mist-config-guardian-secrets

secrets:
  # Prefer an externally managed Secret in production. Enabling this stores
  # sensitive values in the Helm release as well as the generated Secret.
  create: false
  secretKey: ""
  bootstrapAdminToken: ""
  credentialEncryptionKey: ""
  influxdbToken: ""

config:
  environment: production
  apiV1Prefix: /api/v1
  corsOrigins: https://guardian.example.com
  # These endpoints are used only when the corresponding bundled service is disabled.
  mongodbUrl: mongodb://mongodb:27017
  mongodbDatabase: mist_config_guardian
  redisUrl: redis://redis:6379/0
  celeryBrokerUrl: redis://redis:6379/1
  celeryResultBackend: redis://redis:6379/2
  influxdbUrl: http://influxdb:8086
  influxdbOrg: mist_config_guardian
  influxdbBucket: network_monitoring

resources: {}
frontendResources: {}
workerResources: {}

ingress:
  enabled: false
  className: ""
  host: guardian.example.com
  tlsSecretName: ""
